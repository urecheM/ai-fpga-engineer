[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fpga-engineer"
version = "0.2.0"
description = "Rule-based closed-loop pipeline: natural-language spec -> simulated, measured, boundedly-checked VHDL"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["ai_fpga_engineer*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-ra"
