name: Research proposal
description: Propose an experiment, method, or study using the platform
labels: [research]
body:
  - type: textarea
    id: question
    attributes: { label: Research question / hypothesis }
    validations: { required: true }
  - type: textarea
    id: method
    attributes: { label: Method, description: "models, prompts, benchmarks, metrics, statistics" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Reproducibility plan }
  - type: textarea
    id: outcome
    attributes: { label: Expected contribution }
