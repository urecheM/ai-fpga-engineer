name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # HDL toolchain (GHDL/Yosys) is intentionally NOT installed here: the
      # hdleval unit/integration tests validate framework logic with toolchain
      # stages degraded to "skipped". Full tool-backed runs happen via the
      # Dockerfile (which installs GHDL + Yosys) and can be re-enabled here once
      # the v1 reference designs are GHDL-verified.
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff lint (advisory)
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check src tests scripts
      - name: mypy (advisory)
        continue-on-error: true
        run: mypy src/hdleval
      - name: Tests + coverage
        run: pytest --cov=hdleval --cov-report=xml --cov-report=term-missing
      - name: Coverage badge data
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"coverage={float(r.get('line-rate'))*100:.1f}%")
          PY
      - name: Reproduce artifacts
        run: python reproduce.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hdleval-artifacts
          path: |
            results/
            publication/
            website/
