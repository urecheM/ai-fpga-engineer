name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HDL toolchain (GHDL + Yosys)
        run: sudo apt-get update && sudo apt-get install -y ghdl yosys || true
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy src/hdleval
      - name: Tests + coverage
        run: pytest --cov=hdleval --cov-report=xml --cov-report=term-missing
      - name: Coverage badge data
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"coverage={float(r.get('line-rate'))*100:.1f}%")
          PY
      - name: Reproduce artifacts
        run: python reproduce.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hdleval-artifacts
          path: |
            results/
            publication/
            website/
