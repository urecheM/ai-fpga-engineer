name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff lint (advisory)
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check src tests scripts
      - name: mypy (advisory)
        continue-on-error: true
        run: mypy src/hdleval
      - name: Tests + coverage
        run: pytest --cov=hdleval --cov-report=xml --cov-report=term-missing
      - name: Coverage badge data
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"coverage={float(r.get('line-rate'))*100:.1f}%")
          PY
      - name: Reproduce artifacts
        run: python reproduce.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hdleval-artifacts
          path: |
            results/
            publication/
            website/

  synthesis:
    name: synthesis (tool-backed)
    runs-on: ubuntu-latest
    env:
      OSS_CAD_SUITE_TAG: "2026-07-09"
      HDLEVAL_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache OSS CAD Suite
        id: oss-cad-suite-cache
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_TAG }}

      - name: Install OSS CAD Suite (GHDL + Yosys + ghdl-yosys-plugin)
        if: steps.oss-cad-suite-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          stamp="${OSS_CAD_SUITE_TAG//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_TAG}/oss-cad-suite-linux-x64-${stamp}.tgz"
          echo "downloading $url"
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/oss-cad-suite.tgz
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm -f /tmp/oss-cad-suite.tgz

      - name: Put HDL toolchain on PATH
        run: echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Assert ghdl-yosys-plugin is available
        run: python scripts/check_toolchain.py

      - name: Synthesize v1 reference designs (cell counts must be non-zero)
        run: python scripts/check_toolchain.py --synthesize

      - name: Tool-backed tests
        run: pytest -q
