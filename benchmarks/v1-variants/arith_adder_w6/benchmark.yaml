id: arith_adder_w6
category: arithmetic
title: 6-bit adder with carry in/out
entity: adder_w6
specification: Design a 6-bit unsigned adder. Inputs a and b are 6-bit vectors and
  cin is a carry-in bit; output sum is the low 6 bits of a + b + cin and cout is the
  carry out. Purely combinational.
functional_requirements:
- sum = (a + b + cin) mod 2^6
- cout = carry out of bit 5
