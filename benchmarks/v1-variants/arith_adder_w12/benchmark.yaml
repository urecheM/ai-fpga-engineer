id: arith_adder_w12
category: arithmetic
title: 12-bit adder with carry in/out
entity: adder_w12
specification: Design a 12-bit unsigned adder. Inputs a and b are 12-bit vectors and
  cin is a carry-in bit; output sum is the low 12 bits of a + b + cin and cout is
  the carry out. Purely combinational.
functional_requirements:
- sum = (a + b + cin) mod 2^12
- cout = carry out of bit 11
