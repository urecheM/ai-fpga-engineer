id: arith_adder_w16
category: arithmetic
title: 16-bit adder with carry in/out
entity: adder_w16
specification: Design a 16-bit unsigned adder. Inputs a and b are 16-bit vectors and
  cin is a carry-in bit; output sum is the low 16 bits of a + b + cin and cout is
  the carry out. Purely combinational.
functional_requirements:
- sum = (a + b + cin) mod 2^16
- cout = carry out of bit 15
