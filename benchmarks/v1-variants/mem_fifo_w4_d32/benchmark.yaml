id: mem_fifo_w4_d32
category: memory
title: Synchronous FIFO (4-bit, depth 32)
entity: fifo_w4_d32
specification: Design a synchronous FIFO, 4 bits wide and 32 entries deep, with wr_en
  and rd_en, full and empty flags, and a synchronous active-high reset. A write when
  full and a read when empty are ignored. A read updates dout on the clock edge at
  which rd_en is sampled high (one-cycle read latency); dout holds its value otherwise.
  full and empty are combinational functions of the stored entry count.
functional_requirements:
- FIFO ordering preserved
- full/empty flags correct
- no overflow/underflow
