id: fsm_seqdet_p1101
category: fsm
title: Overlapping sequence detector (1101)
entity: seqdet_p1101
specification: Design an overlapping Mealy sequence detector for the serial bit pattern
  1101 (first bit received first). din is sampled on each rising clock edge. found
  is a combinational output that is '1' in the cycle in which din carries the final
  bit of an occurrence of the pattern (overlapping occurrences count), and '0' otherwise.
  Synchronous active-high reset clears all history.
functional_requirements:
- detects overlapping occurrences of 1101
- Mealy timing (found asserted with the final bit)
