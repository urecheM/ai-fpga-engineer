id: comm_i2c_ctrl
version: 1.0.0
category: communication
title: I2C bit-level controller (start/stop/byte)
specification: Design an I2C master byte controller that generates START and STOP
  conditions and shifts out 8 bits MSB-first on sda synchronised to scl, asserting
  done after the byte and sampling the ack bit.
functional_requirements:
- generates START and STOP
- 8-bit MSB-first shift
- samples ack
